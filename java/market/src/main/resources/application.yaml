server:
  # 8080 被 Steam 占用，改用 8081
  port: 8081

spring:
  application:
    name: market

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.yjx.market: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{30} - %msg%n"

# ============================================================
# 阿里云 OSS 配置
# 密钥用 ${环境变量:默认值} 写法：优先读环境变量，读不到用默认值
# 本地开发方便，但上线前务必改成纯环境变量，不要提交真实密钥到 Git
# ============================================================
oss:
  endpoint: oss-cn-hangzhou.aliyuncs.com
  bucket: market-oss-zyd
  access-key-id: ${OSS_AK:}
  access-key-secret: ${OSS_SK:}

  # 图片处理样式名：控制台里建的那个 wm
  watermark-style: wm
  # 签名 URL 有效期（分钟）
  sign-expire-minutes: 30

# ============================================================
# Python AI 服务地址（Step 2 连通性验证用）
# ============================================================
ai:
  python:
    base-url: http://127.0.0.1:8000